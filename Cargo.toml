[package]
name = "plainsheet"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.15", features = ["backend-winit", "renderer-femtovg"] }
pyo3 = { version = "0.23", features = ["auto-initialize"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.14"
serde_json = "1.0"
memmap2 = "0.9"
memchr = "2.7"
dirs = "5.0"

[build-dependencies]
slint-build = "1.15"
