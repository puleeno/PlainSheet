<html><body>
<div #out>start</div>
<script>
try {
  document.querySelector("#out").textContent = "script running";
  let r = Window.this.xcall("ping", "hello");
  document.querySelector("#out").textContent = "got: " + r;
} catch (e) {
  document.querySelector("#out").textContent = "ERR: " + e;
}
Window.this.close();
</script>
</body></html>
